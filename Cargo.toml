[package]
name = "machine"
version = "0.1.0"
edition = "2021"
description = "A small bare-metal base for UEFI kernels on x86_64 and AArch64: the heap, CPUs, timers, interrupts, console, screen, PCI and virtio"
license = "MIT"

[lib]
test = false
bench = false

[dependencies]
uefi = { version = "0.35", default-features = false, features = ["alloc"] }
linked_list_allocator = "0.10"
spin = "0.10"
font8x8 = { version = "0.3", default-features = false }
pc-keyboard = "0.9"
