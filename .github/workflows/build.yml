# The crate builds for both of its targets.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-uefi, aarch64-unknown-uefi]
    steps:
      - uses: actions/checkout@v5
      - name: Rust, with the standard library's source
        run: rustup component add rust-src
      - name: Build
        run: RUSTC_BOOTSTRAP=1 cargo build --release --target ${{ matrix.target }}
